syntax = "proto3";

option go_package = "./";

service AbuseStore {
  // Pushes abuse to the store
  rpc Push (PushRequest) returns (PushReply) {}

  // Check abuse in the store for existence
  rpc Check (CheckRequest) returns (CheckReply) {}

  // Exempts an infohash whose ban is still in its review window: every
  // non-exempt row waits for a purge that has not come yet. Anything else
  // (an immediate purge, a row from before the delay, a purge already due)
  // is FAILED_PRECONDITION; an unknown infohash is NOT_FOUND. Served on the
  // admin port only (127.0.0.1, --admin-port); the public port answers
  // UNIMPLEMENTED. Every exemption is mailed to support.
  rpc Exempt (ExemptRequest) returns (ExemptReply) {}
}

message ExemptRequest {
  string infohash = 1;
  // Why, for the server log and the letter to support.
  string reason = 2;
}

// rows is how many rows were set exempt; 0 when the infohash already was.
message ExemptReply {
  int32 rows = 1;
}

// The push response message containing
message PushReply {
}

// The push request message
message PushRequest {
  string notice_id   = 1;
  string infohash    = 2;
  string filename    = 3;
  string work        = 4;
  int64  started_at  = 5;
  string email       = 6;
  string description = 7;
  string subject     = 8;
  enum Cause {
    ILLEGAL_CONTENT = 0;
    MALWARE         = 1;
    APP_ERROR       = 2;
    QUESTION        = 3;
  }
  Cause cause        = 9;
  enum Source {
    MAIL = 0;
    FORM = 1;
  }
  Source source      = 10;
  // Raw SHA-256 content fingerprint of the blocked payload, supplied by the
  // caller (it has both this service and torrent-store to hand; having
  // abuse-store fetch it itself would close a dependency cycle). Optional — a
  // ban without it still works, it just does not cover re-uploads.
  bytes fingerprint = 11;
  // Purge the data at once instead of after the server's --purge-delay: for
  // bans that must not wait for review (the CSAM ban script). On a hash that
  // is already blocked it brings a pending purge forward, and it overrides
  // any exemption of the hash. The block itself is immediate either way.
  // Honoured on the admin port only; the public port ignores it.
  bool purge_now = 12;
  // More infohashes named by the same notice. Each is validated like
  // infohash, gets its own row under the same notice_id, and the notice is
  // mailed once listing all of them. The fingerprint applies to infohash only.
  repeated string extra_infohashes = 13;
}

// The check request message containing the infoHash and, optionally, the
// content fingerprints of the same torrent. A match on either blocks: the
// infohash catches the exact torrent, a fingerprint catches the same payload
// republished under a different name.
message CheckRequest {
  string infohash = 1;
  bytes fingerprint = 2;
}

// The check response message containing existance flag
message CheckReply {
  bool exists = 1;
}
